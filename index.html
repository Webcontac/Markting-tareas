.tab.on{background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent;color:#fff;box-shadow:0 0 22px rgba(255,31,61,.6)}
.stage{position:relative;max-width:1100px;margin:0 auto;padding:10px 0}
.ghost{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-weight:900;font-size:clamp(44px,12vw,130px);letter-spacing:.1em;text-transform:uppercase;color:transparent;-webkit-text-stroke:2px rgba(255,31,61,.35);text-shadow:0 0 40px rgba(255,31,61,.3);pointer-events:none;white-space:nowrap;overflow:hidden}
.viewport{position:relative;z-index:2}
.track{position:relative;height:490px;perspective:1200px}
.card{position:absolute;width:290px;min-height:410px;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;overflow:hidden;cursor:pointer;
background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.16) 36%,transparent 44%),linear-gradient(145deg,rgba(255,255,255,.12),rgba(18,0,4,.6) 55%,rgba(255,31,61,.16));
backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);
border:1px solid rgba(255,255,255,.38);box-shadow:0 25px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.7),inset 1px 0 0 rgba(255,255,255,.3),inset 0 0 35px rgba(255,255,255,.08),inset 0 -25px 45px rgba(255,31,61,.12);
transition:transform .6s cubic-bezier(.25,1,.5,1),opacity .6s,filter .6s}
.card::before{content:"";position:absolute;inset:0;border-radius:22px;padding:2px;opacity:0;pointer-events:none;
background:conic-gradient(from var(--ang),transparent 0 55%,var(--red),#fff,var(--red),transparent);
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3.5s linear infinite}
.card::after{content:"";position:absolute;inset:0;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .4s;
background:radial-gradient(circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.28),transparent 48%)}
.card.active{animation:glow 2.6s ease-in-out infinite alternate}
.card.active::before,.card.active::after{opacity:1}
@keyframes spin{to{--ang:360deg}}
@keyframes glow{from{box-shadow:0 25px 50px rgba(0,0,0,.7),0 0 25px rgba(255,31,61,.35),inset 0 1px 0 rgba(255,255,255,.4)}to{box-shadow:0 25px 60px rgba(0,0,0,.7),0 0 60px rgba(255,31,61,.7),inset 0 1px 0 rgba(255,255,255,.5)}}
.card:not(.active) .row,.card:not(.active) .go,.card:not(.active) .tools{pointer-events:none}
.logo{width:68px;height:68px;border-radius:18px;display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;overflow:hidden;flex:none;box-shadow:0 8px 22px rgba(255,31,61,.55),inset 0 1px 0 rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.3)}
.logo img{width:100%;height:100%;object-fit:cover}
.head{display:flex;gap:14px;align-items:center}
.head h3{margin:0;font-size:18px;line-height:1.2;word-break:break-word}
.head small{color:var(--red);font-size:12px;font-weight:700;letter-spacing:.04em}
.go{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:800;font-size:14px;padding:11px;border-radius:12px;box-shadow:0 6px 20px rgba(255,31,61,.5);position:relative;overflow:hidden}
.go::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 2.8s infinite}
@keyframes shine{to{left:140%}}
.url{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:7px 8px 7px 11px;display:flex;align-items:center;gap:6px;box-shadow:inset 0 1px 6px rgba(0,0,0,.5)}
.row label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--red);font-weight:700;display:block}
.row .val{min-width:0;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;transition:.2s}
.mini:hover{background:var(--red);border-color:var(--red);box-shadow:0 0 14px rgba(255,31,61,.7)}
.tools{display:flex;gap:6px;margin-top:auto}
.tools .mini{flex:1}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:50;width:46px;height:46px;border-radius:12px;border:0;background:#fff;color:#000;font-size:22px;font-weight:900;box-shadow:0 0 22px rgba(255,255,255,.35);transition:.25s}
.nav:hover{background:var(--red);color:#fff;box-shadow:0 0 28px rgba(255,31,61,.8)}
.nav.l{left:max(10px,2vw)}.nav.r{right:max(10px,2vw)}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 18px;position:relative;z-index:3;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);border:0;padding:0;transition:.3s}
.dot.on{background:var(--red);width:28px;border-radius:6px;box-shadow:0 0 12px rgba(255,31,61,.9)}
.empty{position:relative;z-index:3;text-align:center;color:var(--muted);padding:120px 20px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:0 20px 24px;max-width:700px;margin:0 auto}
dialog{border:1px solid rgba(255,255,255,.22);border-radius:20px;background:linear-gradient(145deg,rgba(40,0,6,.92),rgba(0,0,0,.94));color:#fff;width:min(440px,92vw);padding:22px;box-shadow:0 0 60px rgba(255,31,61,.35)}
dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 12px;font-size:18px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{font:inherit;font-size:14px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--red);box-shadow:0 0 12px rgba(255,31,61,.5)}
.f select option{background:#111;color:#fff}
.f textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
.end{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.3s;z-index:99;pointer-events:none;box-shadow:0 0 24px rgba(255,31,61,.7)}
.toast.on{opacity:1;transform:translateX(-50%)}
.pwrow{display:flex;gap:6px}.pwrow input{flex:1;min-width:0}
.meter{height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.meter b{display:block;height:100%;width:0;transition:.3s}
.srow,.snew{display:flex;gap:8px;align-items:center}.srow{margin-bottom:8px}.snew{margin-top:12px}
.srow input,.snew input,#sq{flex:1;min-width:0;font:inherit;font-size:14px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff}
.srow input:focus,.snew input:focus,#sq:focus{outline:0;border-color:var(--red);box-shadow:0 0 12px rgba(255,31,61,.5)}
#sq{width:100%;font-size:16px;padding:13px 14px}
.cnt{font-size:12px;color:var(--muted);min-width:22px;text-align:center}
#sres{max-height:50vh;overflow-y:auto}
.res{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.res .logo{width:38px;height:38px;font-size:17px;border-radius:10px}
.res small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res.on,.res:hover{background:rgba(255,31,61,.22);border-color:rgba(255,31,61,.6)}
.empty2{text-align:center;color:var(--muted);padding:20px}
.hint{margin:10px 0 0;font-size:11px;color:var(--muted);text-align:center}
#lock{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(255,31,61,.4),rgba(0,0,0,.96) 68%);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#lock.on{display:flex}
#lPanel{width:min(320px,90vw);padding:28px 24px 22px;border-radius:26px;text-align:center;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.14) 36%,transparent 44%),linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.32);box-shadow:0 0 70px rgba(255,31,61,.5),inset 0 1px 0 rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#lPanel h2{margin:6px 0 16px;font-size:18px}
.lico{font-size:36px;filter:drop-shadow(0 0 16px #ff1f3d)}
#lDots{display:flex;gap:14px;justify-content:center;margin-bottom:18px}
#lDots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.6);transition:.2s}
#lDots i.on{background:var(--red);border-color:var(--red);box-shadow:0 0 14px var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);font-size:20px;font-weight:700;transition:.15s}
.key:hover{background:rgba(255,31,61,.5);box-shadow:0 0 18px rgba(255,31,61,.7)}
.key:active{transform:scale(.93)}
#lCancel{margin-top:14px;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@media(max-width:600px){.track{height:470px}.card{width:250px;padding:16px}.nav{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<body>
<header>
  <div class="brand"><i></i>CENTRO DE ACCESOS</div>
  <div class="actions">
    <button class="btn" id="lockBtn">🔒 Bloquear</button>
    <button class="btn" id="searchBtn">🔎 Buscar</button>
    <button class="btn" id="secBtn">Secciones</button>
    <button class="btn primary" id="add">+ Agregar</button>
    <button class="btn" id="backup">Respaldo</button>
  </div>
</header>
<nav id="tabs"></nav>
<main class="stage">
  <div class="ghost" id="ghost"></div>
  <div class="viewport" id="vp">
    <div class="track" id="track"></div>
    <button class="nav l" id="prev" aria-label="Anterior">‹</button>
    <button class="nav r" id="next" aria-label="Siguiente">›</button>
  </div>
  <div class="dots" id="dots"></div>
</main>
<footer>Tus datos se guardan solo en este navegador. Usa «Respaldo» para copiarlos o restaurarlos. Las tarjetas de ejemplo son ficticias: edítalas o bórralas. <a href="#" id="pinOff" style="color:var(--red)">Quitar PIN</a></footer>

<dialog id="dlg">
  <h2 id="dtitle">Agregar acceso</h2>
  <div class="f"><span>Nombre</span><input id="fName" maxlength="60"></div>
  <div class="f"><span>Sección</span><select id="fSec"></select></div>
  <div class="f"><span>Enlace</span><input id="fUrl" placeholder="https://..."></div>
  <div class="f"><span>Correo / usuario</span><input id="fMail" autocomplete="off"></div>
  <div class="f"><span>Contraseña</span><div class="pwrow"><input id="fPass" autocomplete="off"><button class="mini" id="gen" type="button">Generar</button></div><div class="meter"><b id="mBar"></b></div></div>
  <div class="f"><span>Logo (imagen opcional)</span><input id="fLogo" type="file" accept="image/*"></div>
  <div class="end"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Guardar</button></div>
</dialog>

<dialog id="bdlg">
  <h2>Respaldo</h2>
  <div class="f"><span>Copia este texto para guardarlo, o pega uno anterior y pulsa «Restaurar».</span><textarea id="bText"></textarea></div>
  <div class="end"><button class="btn" id="bCopy">Copiar</button><button class="btn" id="bRestore">Restaurar</button><button class="btn primary" id="bClose">Cerrar</button></div>
</dialog>
<dialog id="sedlg">
  <h2>Secciones</h2>
  <div id="secList"></div>
  <div class="snew"><input id="secNew" maxlength="30" placeholder="Nueva sección…"><button class="btn primary" id="secAdd">Agregar</button></div>
  <div class="end"><button class="btn" id="secClose">Cerrar</button></div>
</dialog>
<dialog id="sdlg">
  <div class="f"><input id="sq" autocomplete="off" placeholder="Buscar por nombre, enlace o correo…"></div>
  <div id="sres"></div>
  <p class="hint">↑ ↓ navegar · Enter abrir · Esc cerrar · Atajo: Ctrl+K o /</p>
</dialog>
<div id="lock"><div id="lPanel"><div class="lico">🔐</div><h2 id="lTitle"></h2><div id="lDots"></div><div class="pad" id="pad"></div><button id="lCancel">Cancelar</button></div></div>
<div class="toast" id="toast"></div>

<script>
let SECS=[["portales","Portales de gestión"],["herramientas","Herramientas"],["sitios","Sitios web"],["accesos","Accesos"]];
const SKEY="centro_secciones_v1";
try{const q=JSON.parse(localStorage.getItem(SKEY));if(Array.isArray(q)&&q.length)SECS=q}catch(e){}
function persistSecs(){try{localStorage.setItem(SKEY,JSON.stringify(SECS))}catch(e){}}
const KEY="centro_accesos_v1";
const demo=[
 {id:"d1",sec:"portales",name:"Portal Ejemplo",url:"https://example.com",mail:"usuario@ejemplo.com",pass:"demo1234",logo:""},
 {id:"d2",sec:"portales",name:"Nómina Demo",url:"https://example.org",mail:"rrhh@ejemplo.com",pass:"demo5678",logo:""},
 {id:"d3",sec:"herramientas",name:"Herramienta Demo",url:"https://example.com",mail:"equipo@ejemplo.com",pass:"demo0000",logo:""},
 {id:"d4",sec:"herramientas",name:"Diseño Demo",url:"https://example.net",mail:"arte@ejemplo.com",pass:"demo1111",logo:""},
 {id:"d5",sec:"sitios",name:"Sitio Corporativo",url:"https://example.com",mail:"admin@ejemplo.com",pass:"demo2222",logo:""},
 {id:"d6",sec:"accesos",name:"Servidor Demo",url:"https://example.org",mail:"root@ejemplo.com",pass:"demo3333",logo:""}
];
let items=[],cur="portales",idx=0,shown=new Set(),editId=null,logoData="";
try{const s=localStorage.getItem(KEY);items=s?JSON.parse(s):demo}catch(e){items=demo}
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){toast("No se pudo guardar en el navegador")}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1600)}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function list(){return items.filter(i=>i.sec===cur)}
function safeUrl(u){u=(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;return u}

function renderTabs(){
  $("tabs").innerHTML=SECS.map(([k,n])=>`<button class="tab ${k===cur?"on":""}" data-k="${k}">${n} (${items.filter(i=>i.sec===k).length})</button>`).join("");
  $("ghost").textContent=(SECS.find(s=>s[0]===cur)||[])[1]||"";
}
function render(){
  if(!SECS.find(s=>s[0]===cur))cur=SECS[0][0];
  renderTabs();
  const L=list();
  if(idx>=L.length)idx=Math.max(0,L.length-1);
  if(!L.length){$("track").innerHTML='<div class="empty">Aún no hay accesos en esta sección.<br>Pulsa «+ Agregar».</div>';$("dots").innerHTML="";return}
  $("track").innerHTML=L.map(i=>{
    const shownPw=shown.has(i.id);
    const logo=i.logo?`<img src="${esc(i.logo)}" alt="">`:esc((i.name||"?")[0].toUpperCase());
    const bg=i.logo?"rgba(255,255,255,.1)":"linear-gradient(135deg,#ff3b55,#8a0010)";
    const u=safeUrl(i.url);
    return `<div class="card" data-id="${i.id}">
      <div class="head"><div class="logo" style="background:${bg}">${logo}</div><div><h3>${esc(i.name)}</h3><small>${esc((SECS.find(s=>s[0]===i.sec)||[])[1])}</small></div></div>
      <div class="url">${esc(u)}</div>
      ${u?`<a class="go" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Abrir sitio ↗</a>`:""}
      <div class="row"><div style="flex:1;min-width:0"><label>Correo / usuario</label><div class="val">${esc(i.mail)||"—"}</div></div><button class="mini" data-a="cm">Copiar</button></div>
      <div class="row"><div style="flex:1;min-width:0"><label>Contraseña</label><div class="val">${shownPw?esc(i.pass):"••••••••"}</div></div><button class="mini" data-a="eye">${shownPw?"Ocultar":"Ver"}</button><button class="mini" data-a="cp">Copiar</button></div>
      <div class="tools"><button class="mini" data-a="edit">Editar</button><button class="mini" data-a="del">Eliminar</button></div>
    </div>`}).join("");
  $("dots").innerHTML=L.map((_,n)=>`<button class="dot ${n===idx?"on":""}" data-n="${n}" aria-label="Ir a ${n+1}"></button>`).join("");
  place();
}
function place(){
  const step=innerWidth<600?78:170,tk=$("track"),W=tk.clientWidth,H=tk.clientHeight;
  document.querySelectorAll(".card").forEach((c,n)=>{
    const o=n-idx,a=Math.abs(o);
    c.classList.toggle("active",o===0);
    c.style.left=Math.round((W-c.offsetWidth)/2)+"px";c.style.top=Math.round((H-c.offsetHeight)/2)+"px";
    c.style.transform=o===0?"none":`translateX(${o*step}px) translateZ(${-a*70}px) rotateY(${-o*16}deg) scale(${1-a*.08})`;
    c.style.zIndex=20-a;
    c.style.opacity=a>2?0:a===0?1:.85-.2*(a-1);
    c.style.filter=o===0?"none":`brightness(${.8-a*.12}) saturate(.8)`;
    c.style.pointerEvents=a>2?"none":"auto";
  });
  document.querySelectorAll(".dot").forEach((d,n)=>d.classList.toggle("on",n===idx));
}
function go(n){const L=list();if(!L.length)return;idx=(n+L.length)%L.length;place()}
async function copy(t,msg){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}
  toast(msg)
}
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(b){cur=b.dataset.k;idx=0;render()}};
$("dots").onclick=e=>{const b=e.target.closest(".dot");if(b)go(+b.dataset.n)};
$("prev").onclick=()=>go(idx-1);$("next").onclick=()=>go(idx+1);
$("track").onclick=e=>{
  const c=e.target.closest(".card");if(!c)return;
  const L=list(),n=L.findIndex(i=>i.id===c.dataset.id);
  if(n!==idx){go(n);return}
  const b=e.target.closest("[data-a]");if(!b)return;
  const it=items.find(i=>i.id===c.dataset.id),a=b.dataset.a;
  if(a==="cm")copy(it.mail,"Correo copiado");
  if(a==="cp")copy(it.pass,"Contraseña copiada");
  if(a==="eye"){shown.has(it.id)?shown.delete(it.id):shown.add(it.id);render()}
  if(a==="edit")openForm(it);
  if(a==="del"&&confirm("¿Eliminar «"+it.name+"»?")){items=items.filter(i=>i.id!==it.id);persist();render()}
};
document.addEventListener("keydown",e=>{
  if(document.querySelector("dialog[open]")||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.key==="ArrowLeft")go(idx-1);if(e.key==="ArrowRight")go(idx+1)});
let sx=0;
$("vp").addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});
$("vp").addEventListener("touchend",e=>{const d=e.changedTouches[0].screenX-sx;if(d<-40)go(idx+1);if(d>40)go(idx-1)},{passive:true});
addEventListener("resize",place);
$("track").addEventListener("pointermove",e=>{const c=e.target.closest(".card.active");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");c.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%")});

function fillSec(){$("fSec").innerHTML=SECS.map(([k,n])=>`<option value="${k}">${esc(n)}</option>`).join("")}
function openForm(it){
  fillSec();editId=it?it.id:null;logoData=it?it.logo:"";
  $("dtitle").textContent=it?"Editar acceso":"Agregar acceso";
  $("fName").value=it?it.name:"";$("fSec").value=it?it.sec:cur;$("fUrl").value=it?it.url:"";
  $("fMail").value=it?it.mail:"";$("fPass").value=it?it.pass:"";$("fLogo").value="";
  meter();$("dlg").showModal();
}
$("add").onclick=()=>openForm(null);
$("cancel").onclick=()=>$("dlg").close();
$("fLogo").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image(),r=new FileReader();
  r.onload=()=>{img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");
    const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);
    logoData=c.toDataURL("image/png")};img.src=r.result};
  r.readAsDataURL(f);
};
$("save").onclick=()=>{
  const name=$("fName").value.trim();if(!name){toast("Escribe un nombre");return}
  const o={id:editId||"i"+Date.now(),sec:$("fSec").value,name,url:$("fUrl").value.trim(),mail:$("fMail").value.trim(),pass:$("fPass").value,logo:logoData};

$("bClose").onclick=()=>$("bdlg").close();
$("bCopy").onclick=()=>copy($("bText").value,"Respaldo copiado");
$("bRestore").onclick=()=>{
  try{let d=JSON.parse($("bText").value),sc=null;if(!Array.isArray(d)){if(!d||!Array.isArray(d.items))throw 0;sc=Array.isArray(d.secs)&&d.secs.length?d.secs:null;d=d.items}
    if(confirm("Esto reemplazará tus accesos actuales. ¿Continuar?")){items=d;if(sc){SECS=sc;persistSecs()}persist();idx=0;$("bdlg").close();render();toast("Restaurado")}}

render();

/* Secciones */

}

$("secList").onclick=e=>{
  const k=e.target.dataset.del;if(!k)return;
  if(SECS.length<2){toast("Debe quedar al menos una sección");return}
  const n=items.filter(i=>i.sec===k).length,rest=SECS.filter(s=>s[0]!==k);
  if(!confirm(n?"Esta sección tiene "+n+" acceso(s). Se moverán a «"+rest[0][1]+"». ¿Continuar?":"¿Quitar esta sección?"))return;
  items=items.map(i=>i.sec===k?{...i,sec:rest[0][0]}:i);SECS=rest;persist();persistSecs();

function addSec(){const v=$("secNew").value.trim();if(!v)return;const k="s"+Date.now();SECS=[...SECS,[k,v]];persistSecs();$("secNew").value="";cur=k;idx=0;renderSecs();render();toast("Sección agregada")}

/* Buscador global */
let sres=[],sel=0;
function openSearch(){if($("lock").classList.contains("on"))return;$("sdlg").showModal();$("sq").value="";doSearch();$("sq").focus()}
function doSearch(){const q=$("sq").value.trim().toLowerCase();sres=items.filter(i=>!q||[i.name,i.url,i.mail].join(" ").toLowerCase().includes(q)).slice(0,30);sel=0;drawS()}
function drawS(){
  $("sres").innerHTML=sres.length?sres.map((i,n)=>{
    const lg=i.logo?`<img src="${esc(i.logo)}" alt="">`:esc((i.name||"?")[0].toUpperCase());
    const bg=i.logo?"rgba(255,255,255,.1)":"linear-gradient(135deg,#ff3b55,#8a0010)";
    const sc=(SECS.find(x=>x[0]===i.sec)||[])[1]||"";
    return `<div class="res ${n===sel?"on":""}" data-n="${n}"><div class="logo" style="background:${bg}">${lg}</div><div style="min-width:0"><b>${esc(i.name)}</b><small>${esc(sc)} · ${esc(i.mail)}</small></div></div>`}).join(""):'<div class="empty2">Sin resultados</div>';
  const o=$("sres").querySelector(".on");if(o)o.scrollIntoView({block:"nearest"});
}
function pick(n){const i=sres[n];if(!i)return;$("sdlg").close();cur=i.sec;idx=Math.max(0,list().findIndex(x=>x.id===i.id));render()}
$("searchBtn").onclick=openSearch;
$("sq").oninput=doSearch;
$("sq").onkeydown=e=>{
  if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(sres.length-1,sel+1);drawS()}
  if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);drawS()}
  if(e.key==="Enter"){e.preventDefault();pick(sel)}
};
$("sres").onclick=e=>{const r=e.target.closest(".res");if(r)pick(+r.dataset.n)};
document.addEventListener("keydown",e=>{
  if(document.querySelector("dialog[open]"))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch();return}
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();openSearch()}
});

/* Generador y medidor de contraseñas */
function strength(p){let n=0;if(p.length>=8)n++;if(p.length>=12)n++;if(p.length>=16)n++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))n++;if(/\d/.test(p))n++;if(/[^A-Za-z0-9]/.test(p))n++;return n}
function meter(){const p=$("fPass").value,n=p?strength(p):0,b=$("mBar");b.style.width=(n/6*100)+"%";b.style.background=n<=2?"#ff1f3d":n<=4?"#ffb020":"#3ddc97"}
$("fPass").oninput=meter;
$("gen").onclick=()=>{
  const cs="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?",a=new Uint32Array(18);
  crypto.getRandomValues(a);$("fPass").value=Array.from(a,x=>cs[x%cs.length]).join("");meter();toast("Contraseña segura generada");
};

/* Bloqueo con PIN */
const PKEY="centro_pin_v1";
let pinHash=null,lmode="unlock",buf="",first="",lockT;
try{pinHash=localStorage.getItem(PKEY)}catch(e){}
async function hash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("centro:"+s));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join("")}
$("pad").innerHTML=["1","2","3","4","5","6","7","8","9","","0","del"].map(k=>k===""?"<span></span>":`<button class="key" data-k="${k}">${k==="del"?"⌫":k}</button>`).join("");
function lockUI(){
  $("lTitle").textContent=lmode==="unlock"?"Bóveda bloqueada":first?"Confirma tu PIN":"Crea tu PIN de 4 dígitos";
  $("lDots").innerHTML=[0,1,2,3].map(n=>`<i class="${n<buf.length?"on":""}"></i>`).join("");
  $("lCancel").style.display=lmode==="set"?"inline":"none";
}
function showLock(m){
  document.querySelectorAll("dialog[open]").forEach(d=>d.close());
  shown.clear();render();
  lmode=m;buf="";first="";clearTimeout(lockT);$("lock").classList.add("on");lockUI();
}
function unlock(){$("lock").classList.remove("on");armIdle()}
function bad(){const p=$("lPanel");p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");buf="";setTimeout(lockUI,300)}
async function press(d){
  if(!$("lock").classList.contains("on"))return;
  if(d==="del"){buf=buf.slice(0,-1);lockUI();return}
  if(buf.length>=4)return;
  buf+=d;lockUI();
  if(buf.length<4)return;
  if(lmode==="unlock"){(await hash(buf))===pinHash?unlock():bad()}
  else if(!first){first=buf;buf="";setTimeout(lockUI,150)}
  else if(first===buf){pinHash=await hash(buf);try{localStorage.setItem(PKEY,pinHash)}catch(e){}unlock();toast("PIN creado")}
  else{first="";bad()}
}
function armIdle(){clearTimeout(lockT);if(pinHash)lockT=setTimeout(()=>showLock("unlock"),120000)}
$("pad").onclick=e=>{const b=e.target.closest(".key");if(b)press(b.dataset.k)};
$("lCancel").onclick=()=>$("lock").classList.remove("on");
$("lockBtn").onclick=()=>showLock(pinHash?"unlock":"set");
$("pinOff").onclick=e=>{e.preventDefault();if(pinHash&&confirm("¿Quitar el PIN? La página dejará de bloquearse.")){pinHash=null;try{localStorage.removeItem(PKEY)}catch(_){}clearTimeout(lockT);toast("PIN quitado")}else if(!pinHash)toast("No hay PIN activo")};
addEventListener("keydown",e=>{if(!$("lock").classList.contains("on"))return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del")});
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{if(pinHash&&!$("lock").classList.contains("on"))armIdle()},{passive:true}));
if(pinHash)showLock("unlock");

<script>
function showAcc(){const f=document.getElementById('accFrame'),on=view==='accesos';document.getElementById('view').style.display=on?'none':'';f.style.display=on?'block':'none';if(on&&!f.dataset.l){f.dataset.l=1;f.srcdoc=document.getElementById('accesos-src').textContent.replace(/<\\\/script/g,'</script')}}
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ds=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>ds(new Date());
const fm=s=>{if(!s)return'—';const[a,b,c]=s.split('-');return c+'/'+b+'/'+a};
let S={tasks:[],acc:[],ev:[]},view='resumen',cal=new Date(),F={q:'',ag:'',st:'',mes:''},eT=null;
try{const r=JSON.parse(localStorage.getItem('mkt_ops_v1'));if(r&&r.tasks)S=Object.assign({acc:[],ev:[]},r)}catch(e){}
function save(){try{localStorage.setItem('mkt_ops_v1',JSON.stringify(S))}catch(e){toast('No se pudo guardar en el navegador')}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
async function cp(t,m){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast(m)}
const od=t=>t.estado!=='Completada'&&t.fecha&&t.fecha<today();
const cls=s=>s.replace(' ','');
const OK=t=>t.estado==='Completada';

/* ---------- Vistas ---------- */
const TITLES={resumen:'Resumen',rapido:'Carga rápida por lotes',tareas:'Tablero de tareas',calendario:'Calendario',registro:'Registro mensual',accesos:'Centro de accesos'};
function go(v){view=v;render()}
function render(){
  document.querySelectorAll('.nv[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#ttl').innerHTML='<span>//</span> '+TITLES[view];
  $('#dt').textContent=new Date().toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  $('#c-t').textContent=S.tasks.filter(t=>!OK(t)).length;
  $('#topbtn').innerHTML=(view==='accesos'||view==='rapido')?'':'<button class="btn p" onclick="openT()">+ Nueva tarea</button>';
  $('#view').innerHTML=({resumen:vRes,rapido:vQ,tareas:vTar,calendario:vCal,registro:vReg,accesos:()=>''})[view]();showAcc();
  if(view==='rapido')drawQ();
}
function vRes(){
  const T=S.tasks,n=e=>T.filter(t=>t.estado===e).length,v=T.filter(od).length;
  const k=[['Total',T.length,''],['Pendientes',n('Pendiente'),'var(--amb)'],['En curso',n('En curso'),'var(--ax)'],['Completadas',n('Completada'),'var(--ok)'],['Vencidas',v,'var(--red)']];
  let h='<div class="kpis">'+k.map(x=>`<div class="card kpi"><b style="color:${x[2]}">${x[1]}</b><span>${x[0]}</span></div>`).join('')+'</div><div class="cols2"><div class="card"><h3>Carga por agente</h3>';
  ['Alexander','Danner','Ambos'].forEach(a=>{const A=T.filter(t=>t.asignado===a),d=A.filter(OK).length,pc=A.length?Math.round(d/A.length*100):0;
    h+=`<div class="row"><b class="${a}">${a}</b><span>${d}/${A.length} · ${pc}%</span></div><div class="bar"><i style="width:${pc}%"></i></div>`});
  const sol={};T.forEach(t=>{if(t.solicitante)sol[t.solicitante]=(sol[t.solicitante]||0)+1});
  h+='<h3 style="margin-top:16px">Por solicitante</h3>'+(Object.keys(sol).length?Object.entries(sol).sort((a,b)=>b[1]-a[1]).map(([k,c])=>`<div class="row"><span>${esc(k)}</span><b>${c}</b></div>`).join(''):'<div class="empty">[ sin datos ]</div>')+'</div>';
  const nx=T.filter(t=>!OK(t)).sort((a,b)=>(a.fecha||'9')<(b.fecha||'9')?-1:1).slice(0,7);
  h+='<div class="card"><h3>Próximas entregas</h3>'+(nx.length?nx.map(t=>`<div class="li"><div><b>${esc(t.titulo)}</b><small>${esc(t.solicitante||'—')} · <span class="${t.asignado}">${t.asignado}</span></small></div><span class="tag ${od(t)?'od':''}">${fm(t.fecha)}</span></div>`).join(''):'<div class="empty">[ sin pendientes ]</div>')+'</div></div>';
  return h;
}
function filtered(){return S.tasks.filter(t=>(!F.ag||t.asignado===F.ag)&&(!F.st||t.estado===F.st)&&(!F.q||(t.titulo+t.solicitante+(t.cat||'')).toLowerCase().includes(F.q.toLowerCase())))}
function tbar(){return `<div class="tb"><input placeholder="Buscar…" value="${esc(F.q)}" oninput="F.q=this.value;rr()"><select onchange="F.ag=this.value;render()"><option value="">Todos los agentes</option>${['Alexander','Danner','Ambos'].map(a=>`<option ${F.ag===a?'selected':''}>${a}</option>`).join('')}</select></div>`}
function rr(){const x=$('#view input');const pos=x?x.selectionStart:0;render();const y=$('#view input');if(y){y.focus();y.setSelectionRange(pos,pos)}}

/* Agrupa tareas de un mismo lote (y mismo estado) en un solo bloque */
function grp(L){const m={},o=[];L.forEach(t=>{if(t.lote){const k=t.lote+'|'+t.estado;if(!m[k]){m[k]={lote:t.lote,estado:t.estado,items:[]};o.push(m[k])}m[k].items.push(t)}else o.push({items:[t]})});return o}
function vTar(){
  const L=filtered(),ST=['Pendiente','En curso','Completada'];
  return tbar()+'<div class="kb">'+ST.map((s,i)=>{const C=L.filter(t=>t.estado===s);
    const btns=(mvA,delA,edA)=>`<div class="ac">${i>0?`<button class="btn s" onclick="${mvA(-1)}">◀</button>`:''}${i<2?`<button class="btn s" onclick="${mvA(1)}">▶</button>`:''}${edA?`<button class="btn s" onclick="${edA}">Editar</button>`:''}<button class="btn s" onclick="${delA}">✕</button></div>`;
    const cards=grp(C).map(g=>{const t=g.items[0];
      if(g.items.length>1)return `<div class="tk ${t.asignado}"><p>▣ Lote · ${g.items.length} tareas</p><ul class="lt">${g.items.map(x=>`<li>${esc(x.titulo)}</li>`).join('')}</ul><small>${esc(t.solicitante||'—')} · <span class="${t.asignado}">${t.asignado}</span><br>${fm(t.fecha)}</small>${btns(d=>`mvG('${g.lote}','${s}',${d})`,`delG('${g.lote}','${s}')`,'')}</div>`;
      return `<div class="tk ${t.asignado}"><p>${esc(t.titulo)}</p><small>${esc(t.solicitante||'—')} · <span class="${t.asignado}">${t.asignado}</span><br>${fm(t.fecha)} ${od(t)?'<span class="od">· vencida</span>':''} · ${esc(t.prio)}${t.cat?' · '+esc(t.cat):''}</small>${btns(d=>`mv('${t.id}',${d})`,`delT('${t.id}')`,`openT('${t.id}')`)}</div>`}).join('');
    return `<div class="kc"><h4><span class="${cls(s)}">${s.toUpperCase()}</span><span>${C.length}</span></h4>${cards||'<div class="empty">[ vacío ]</div>'}</div>`}).join('')+'</div>';
}
const ORD=['Pendiente','En curso','Completada'];
function mvG(l,s,d){const n=ORD[Math.max(0,Math.min(2,ORD.indexOf(s)+d))];S.tasks=S.tasks.map(t=>t.lote===l&&t.estado===s?{...t,estado:n}:t);save();render()}
function delG(l,s){if(confirm('¿Eliminar todas las tareas de este lote en esta columna?')){S.tasks=S.tasks.filter(t=>!(t.lote===l&&t.estado===s));save();render()}}

const TIPOS={Importante:'imp','Inhábil':'inh',Vacaciones:'vac'},ICO={Importante:'★ ','Inhábil':'⊘ ',Vacaciones:'☀ '};let dayK=null,eE=null;
const evOn=k=>S.ev.filter(e=>k>=e.fecha&&k<=(e.fin||e.fecha));
function chipsT(E){
  const o=[],seen={};
  E.forEach(t=>{
    if(t.lote){if(seen[t.lote])return;const A=E.filter(x=>x.lote===t.lote);
      if(A.length>1){seen[t.lote]=1;const dn=A.filter(OK).length;o.push(`<span class="ev lot ${t.asignado} ${dn===A.length?'Completada':''}">▣ ${A.length} tareas${dn<A.length?' · '+dn+'/'+A.length:''}</span>`);return}}
    o.push(`<span class="ev ${t.asignado} ${OK(t)?'Completada':''}" onclick="event.stopPropagation();openT('${t.id}')">${esc(t.titulo)}</span>`)});
  return o;
}
function vCal(){
  const y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));
  let h=`<div class="tb" style="align-items:center"><button class="btn" onclick="cm(-1)">◀</button><b style="font:16px 'Share Tech Mono',monospace;min-width:170px;text-align:center">${MES[m]} ${y}</b><button class="btn" onclick="cm(1)">▶</button><button class="btn" onclick="cal=new Date();render()">Hoy</button><span class="lg"><i class="imp"></i>Importante<i class="inh"></i>Inhábil<i class="vac"></i>Vacaciones</span></div><div class="cal">`+['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'].map(d=>`<div class="ch">${d}</div>`).join('');
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=ds(d),E=S.tasks.filter(t=>t.fecha===k),V=evOn(k),c=V.some(e=>e.tipo==='Inhábil')?' inh':V.some(e=>e.tipo==='Vacaciones')?' vac':'';
    const chips=V.map(e=>`<span class="ev ${TIPOS[e.tipo]}">${ICO[e.tipo]}${esc(e.titulo)}${e.quien?' · '+esc(e.quien):''}</span>`).concat(chipsT(E));
    h+=`<div class="cd${d.getMonth()!==m?' off':''}${k===today()?' td':''}${c}" onclick="openD('${k}')"><b>${d.getDate()}</b>${chips.slice(0,4).join('')}${chips.length>4?`<small>+${chips.length-4} más</small>`:''}</div>`}
  return h+'</div>';
}
function openD(k){dayK=k;$('#dDt').textContent=new Date(k+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});drawD();if(!dD.open)dD.showModal()}
function drawD(){
  const V=evOn(dayK),T=S.tasks.filter(t=>t.fecha===dayK);
  $('#dDb').innerHTML='<h3 class="sh">Eventos y días especiales</h3>'+(V.length?V.map(e=>`<div class="li"><span class="tag ${TIPOS[e.tipo]}c">${e.tipo}</span><div><b>${esc(e.titulo)}</b><small>${e.quien?esc(e.quien)+' · ':''}${fm(e.fecha)}${e.fin?' → '+fm(e.fin):''}</small></div><button class="btn s" onclick="openE('${e.id}')">Editar</button><button class="btn s" onclick="delE('${e.id}')">✕</button></div>`).join(''):'<div class="empty">[ ninguno ]</div>')+'<h3 class="sh" style="margin-top:14px">Tareas del día</h3>'+(T.length?T.map(t=>`<div class="li"><button class="btn s" onclick="togT('${t.id}')">${OK(t)?'☑':'☐'}</button><div><b style="${OK(t)?'text-decoration:line-through;color:var(--mut)':''}">${esc(t.titulo)}</b><small>${esc(t.solicitante||'—')} · ${t.asignado} · ${t.estado}${t.lote?' · ▣ lote':''}</small></div><button class="btn s" onclick="openT('${t.id}')">Editar</button><button class="btn s" onclick="delT('${t.id}')">✕</button></div>`).join(''):'<div class="empty">[ sin tareas ]</div>');

function togT(id){S.tasks=S.tasks.map(t=>t.id===id?{...t,estado:OK(t)?'Pendiente':'Completada'}:t);save();render();drawD()}
function openE(id,tipo){eE=id||null;const e=id?S.ev.find(x=>x.id===id):{};$('#dEt').textContent=id?'Editar evento':'Nuevo evento';$('#eTipo').value=e.tipo||tipo||'Importante';$('#eTit').value=e.titulo||'';$('#eQ').value=e.quien||'Ambos';$('#eF').value=e.fecha||dayK||today();$('#eFin').value=e.fin||'';togQ();dE.showModal()}
function togQ(){$('#eQw').style.display=$('#eTipo').value==='Vacaciones'?'':'none'}
function saveE(){const f=$('#eF').value;if(!f){toast('Elige la fecha');return}let fin=$('#eFin').value;if(fin&&fin<f)fin=f;const tipo=$('#eTipo').value;const o={id:eE||'e'+Date.now(),tipo,titulo:$('#eTit').value.trim()||(tipo==='Vacaciones'?'Vacaciones':tipo==='Inhábil'?'Día inhábil':'Evento'),quien:tipo==='Vacaciones'?$('#eQ').value:'',fecha:f,fin:fin&&fin!==f?fin:''};S.ev=eE?S.ev.map(x=>x.id===eE?o:x):[...S.ev,o];save();dE.close();render();if(dD.open)drawD();toast('Guardado')}
function delE(id){if(confirm('¿Quitar este evento?')){S.ev=S.ev.filter(e=>e.id!==id);save();render();if(dD.open)drawD()}}
function cm(n){cal=new Date(cal.getFullYear(),cal.getMonth()+n,1);render()}
function vReg(){
  const ms=[...new Set(S.tasks.map(t=>(t.fecha||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const L=filtered().filter(t=>!F.mes||(t.fecha||'').startsWith(F.mes)).sort((a,b)=>(b.fecha||'')<(a.fecha||'')?-1:1);
  return `<div class="tb"><input placeholder="Buscar…" value="${esc(F.q)}" oninput="F.q=this.value;rr()"><select onchange="F.mes=this.value;render()"><option value="">Todos los meses</option>${ms.map(x=>`<option value="${x}" ${F.mes===x?'selected':''}>${MES[+x.slice(5)-1]} ${x.slice(0,4)}</option>`).join('')}</select><select onchange="F.st=this.value;render()"><option value="">Todos los estados</option>${ORD.map(s=>`<option ${F.st===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="csv()">Copiar CSV</button></div>
  <div class="card"><div class="tw"><table><thead><tr><th>#</th><th>Tarea</th><th>Solicitante</th><th>Asignado</th><th>Categoría</th><th>Prior.</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>`+
  (L.length?L.map((t,i)=>`<tr><td>${p2(i+1)}</td><td>${esc(t.titulo)}</td><td>${esc(t.solicitante||'—')}</td><td><span class="tag ${t.asignado}">${t.asignado}</span></td><td>${esc(t.cat||'—')}</td><td>${esc(t.prio)}</td><td>${fm(t.fecha)}</td><td><span class="tag ${cls(t.estado)}">${t.estado}</span></td><td style="white-space:nowrap"><button class="btn s" onclick="openT('${t.id}')">Editar</button> <button class="btn s" onclick="delT('${t.id}')">✕</button></td></tr>`).join(''):'<tr><td colspan="9"><div class="empty">[ 0 registros ]</div></td></tr>')+'</tbody></table></div></div>';
}

/* ---------- CARGA RÁPIDA POR LOTES ---------- */
const Q={fecha:today(),ag:'Alexander',sol:'',done:true};
function vQ(){
  return `<div class="card qb"><div class="tb" style="align-items:center"><button class="btn s" onclick="qd(-1)">◀</button><input type="date" id="qF" value="${Q.fecha}" onchange="Q.fecha=this.value||today();drawQ()" style="max-width:160px"><button class="btn s" onclick="qd(1)">▶</button><button class="btn s" onclick="qs(0)">Hoy</button><button class="btn s" onclick="qs(-1)">Ayer</button></div>
  <textarea id="qT" placeholder="Una tarea por línea. Ej. para el día 15:&#10;Post de Instagram&#10;Diseño de flyer&#10;Video reel…" oninput="qc()"></textarea>
  <div class="tb" style="margin:8px 0 0;align-items:center"><input id="qS" list="sols" placeholder="Solicitante" value="${esc(Q.sol)}" oninput="Q.sol=this.value"><select onchange="Q.ag=this.value">${['Alexander','Danner','Ambos'].map(a=>`<option ${Q.ag===a?'selected':''}>${a}</option>`).join('')}</select><label class="ck"><input type="checkbox" ${Q.done?'checked':''} onchange="Q.done=this.checked"> Ya realizadas</label><button class="btn p" id="qB" onclick="qAdd()">Subir lote</button></div></div><div class="card" id="qL"></div>`;
}
function qlines(){return $('#qT').value.split('\n').map(s=>s.trim()).filter(Boolean)}
function qc(){const n=qlines().length;$('#qB').textContent=n>1?'Subir lote ('+n+')':'Subir lote'}
function qd(n){const d=new Date(Q.fecha+'T12:00:00');d.setDate(d.getDate()+n);Q.fecha=ds(d);$('#qF').value=Q.fecha;drawQ()}
function qs(n){const d=new Date();d.setDate(d.getDate()+n);Q.fecha=ds(d);$('#qF').value=Q.fecha;drawQ()}
function qAdd(){
  const L=qlines();if(!L.length){$('#qT').focus();return}
  Q.sol=$('#qS').value.trim();
  const lote=L.length>1?'l'+Date.now():'',stamp=Date.now();
  const N=L.map((titulo,i)=>({id:'t'+stamp+'_'+i,titulo,solicitante:Q.sol,asignado:Q.ag,fecha:Q.fecha,estado:Q.done?'Completada':'Pendiente',prio:'Media',cat:'',lote}));
  S.tasks=[...N,...S.tasks];save();$('#qT').value='';qc();$('#qT').focus();drawQ();
  toast(L.length>1?'Lote de '+L.length+' tareas subido':'Tarea agregada');
}
function qT(id){S.tasks=S.tasks.map(t=>t.id===id?{...t,estado:OK(t)?'Pendiente':'Completada'}:t);save();drawQ()}
function qDel(id){S.tasks=S.tasks.filter(t=>t.id!==id);save();drawQ()}
function qAll(l){const A=S.tasks.filter(t=>t.lote===l),all=A.every(OK);S.tasks=S.tasks.map(t=>t.lote===l?{...t,estado:all?'Pendiente':'Completada'}:t);save();drawQ()}
function qDelL(l){if(confirm('¿Eliminar todo el lote?')){S.tasks=S.tasks.filter(t=>t.lote!==l);save();drawQ()}}
function drawQ(){
  const el=$('#qL');if(!el)return;
  const T=S.tasks.filter(t=>t.fecha===Q.fecha),d=T.filter(OK).length;
  const row=t=>`<div class="li"><button class="btn s" onclick="qT('${t.id}')">${OK(t)?'☑':'☐'}</button><div><b style="${OK(t)?'text-decoration:line-through;color:var(--mut)':''}">${esc(t.titulo)}</b><small>${esc(t.solicitante||'—')} · <span class="${t.asignado}">${t.asignado}</span></small></div><button class="btn s" onclick="qDel('${t.id}')">✕</button></div>`;
  const ids=[...new Set(T.filter(t=>t.lote).map(t=>t.lote))];
  let h=`<h3>${new Date(Q.fecha+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})} · ${d}/${T.length} hechas</h3>`;
  ids.forEach(l=>{const A=T.filter(t=>t.lote===l),dn=A.filter(OK).length;
    h+=`<div class="lb"><div class="lh"><b>▣ Lote · ${A.length} tareas · ${dn}/${A.length} hechas</b><span><button class="btn s" onclick="qAll('${l}')">${dn===A.length?'☐ Desmarcar todo':'☑ Todo hecho'}</button> <button class="btn s" onclick="qDelL('${l}')">✕ Lote</button></span></div>${A.map(row).join('')}</div>`});
  h+=T.filter(t=>!t.lote).map(row).join('');
  if(!T.length)h+='<div class="empty">[ sin tareas este día ]</div>';
  el.innerHTML=h;
  $('#c-t').textContent=S.tasks.filter(t=>!OK(t)).length;
}

/* ---------- Acciones ---------- */
function openT(id,fecha){
  eT=id||null;const t=id?S.tasks.find(x=>x.id===id):{};
  $('#dTt').textContent=id?'Editar tarea':'Nueva tarea';
  $('#tTit').value=t.titulo||'';$('#tSol').value=t.solicitante||(id?'':F.lastSol||'');$('#tAg').value=t.asignado||F.lastAg||'Alexander';
  $('#tFec').value=t.fecha||fecha||today();$('#tSt').value=t.estado||'Pendiente';$('#tPr').value=t.prio||'Media';$('#tCat').value=t.cat||'';
  dT.showModal();
}
function saveT(){
  const titulo=$('#tTit').value.trim();if(!titulo){toast('Escribe la tarea');return}
  const old=eT?S.tasks.find(x=>x.id===eT):null;
  const o={id:eT||'t'+Date.now(),titulo,solicitante:$('#tSol').value.trim(),asignado:$('#tAg').value,fecha:$('#tFec').value,estado:$('#tSt').value,prio:$('#tPr').value,cat:$('#tCat').value.trim(),lote:old&&old.lote&&old.fecha===$('#tFec').value?old.lote:''};
  F.lastSol=o.solicitante;F.lastAg=o.asignado;
  S.tasks=eT?S.tasks.map(t=>t.id===eT?o:t):[o,...S.tasks];save();dT.close();render();if(dD.open)drawD();toast('Tarea guardada');
}
function mv(id,d){S.tasks=S.tasks.map(t=>t.id===id?{...t,estado:ORD[Math.max(0,Math.min(2,ORD.indexOf(t.estado)+d))]}:t);save();render()}
function delT(id){if(confirm('¿Eliminar esta tarea?')){S.tasks=S.tasks.filter(t=>t.id!==id);save();render();if(dD.open)drawD()}}
function csv(){const q=v=>'"'+String(v||'').replace(/"/g,'""')+'"';cp(['Tarea,Solicitante,Asignado,Categoría,Prioridad,Fecha,Estado'].concat(filtered().map(t=>[t.titulo,t.solicitante,t.asignado,t.cat,t.prio,t.fecha,t.estado].map(q).join(','))).join('\n'),'CSV copiado — pégalo en Excel o Sheets')}
function openBackup(){$('#bT').value=JSON.stringify(S);dB.showModal()}
function restore(){try{const d=JSON.parse($('#bT').value);if(!d||!Array.isArray(d.tasks))throw 0;if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){S={tasks:d.tasks,acc:d.acc||[],ev:d.ev||[]};save();dB.close();render();toast('Restaurado')}}catch(e){toast('Respaldo no válido')}}
document.querySelectorAll('.nv[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
render();

/* ---------- Matrix rain ---------- */
(function(){
  const c=$('#rain'),x=c.getContext('2d');let cols,dr;
  function rs(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/18);dr=Array.from({length:cols},()=>Math.random()*-60)}
  rs();addEventListener('resize',rs);
  const ch='アイウエオカキクケコサシスセソタチツテトナニハヒフ0123456789ABCDEF[]{}<>/';
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  setInterval(()=>{
    x.fillStyle='rgba(0,0,0,.1)';x.fillRect(0,0,c.width,c.height);
    x.font='14px "Share Tech Mono",monospace';
    for(let i=0;i<cols;i++){
      x.fillStyle=Math.random()>.93?'#ffb3bd':'#ff1f3d';
      x.fillText(ch[Math.floor(Math.random()*ch.length)],i*18,dr[i]*18);
      if(dr[i]*18>c.height&&Math.random()>.975)dr[i]=0;
      dr[i]+=.5;
    }
  },60);
})();
</script>
